<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <title>Página Produtos</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <header>
            <h1>Lagoa UFV</h1>
        </header>
        <main>
            <div class="bodyCenter">
                <section>
                    <!-- Descrição -->
                    <p>
                    Seja bem-vindo a loja do Senhor Capivaristo
                    </p>
                </section>
                <section>
                    <div class="tituloProdutos">
                        <h2>Produtos disponíveis</h2>
                    </div>
                    <div class="gridProdutos">
                        <!-- produtos -->
                        <div class="produto">
                            <img class="imgProduto" src="shopping.webp" alt="Capivara de pelúcia usando cachecol">
                            <div class="infProdutos">
                                <h3>Pelúcia de capivara</h3>
                                <p class="price">RS 67.69</p>
                                <a href="https://www.youtube.com/watch?v=GBIIQ0kP15E" target="_blank">Detalhes</a>
                            </div>
                        </div>
                        <div class="produto">
                            <img class="imgProduto" src="shopping (1).webp" alt="Capivara de pelúcia usando uma mochila">
                            <div class="infProdutos">
                                <h3>Pelúcia de capivara</h3>
                                <p class="price">RS 67.69</p>
                                <a href="https://www.youtube.com/watch?v=GBIIQ0kP15E" target="_blank">Detalhes</a>
                            </div>
                        </div>
                        <div class="produto">
                            <img class="imgProduto" src="images.jfif" alt="Capivara de pelúcia usando toca de unicórnio">
                            <div class="infProdutos">
                                <h3>Pelúcia de capivara</h3>
                                <p class="price">RS 67.69</p>
                                <a href="https://www.youtube.com/watch?v=GBIIQ0kP15E" target="_blank">Detalhes</a>
                            </div>
                        </div>
                    </div>
                </section>
                <section>
                    <h2>Cadastrar produto</h2>
                    <!-- formulário -->
                    <form method="post" action"/cadastro">
                        <label>Imagem:</label>
                        <input type="file" name="img">
                        <label>Nome:</label>
                        <input type="text" name="nome">
                        <label>Preço:</label>
                        <input type="number" name="preco">
                        <button>Enviar</button>
                    </form>
                </section>
            </div>
        </main>
        <footer>
            <p>Minha loja</p>
        </footer>
    </body>
</html>
