<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <title>Página Produtos</title>
    </head>

    <body>
        <header>
            <h1>Lagoa UFV</h1>
        </header>
        <main>
            <section>
                <!-- Descrição -->
                <p>
                Seja bem vindo a loja do Senhor Capivaristo
                </p>
            </section>
            <section>
                <h2>Produtos disponíveis</h2>
                <!-- produtos -->
                <table>
                    <tr>
                        <th>
                            <div class="produto">
                                <img src="shopping.webp" alt="Capivara de pelúcia usando cachecol">
                                <h3>nome</h3>
                                <p>RS 67.69</p>
                                <a href="https://www.youtube.com/watch?v=GBIIQ0kP15E" target="_blank">Detalhes</a>
                            </div>
                        </th>
                        <th>
                            <div class="produto">
                                <img src="shopping (1).webp" alt="Capivara de pelúcia usando uma mochila">
                                <h3>nome</h3>
                                <p>RS 67.69</p>
                                <a href="https://www.youtube.com/watch?v=GBIIQ0kP15E" target="_blank">Detalhes</a>
                            </div>
                        </th>
                        <th>
                            <div class="produto">
                                <img src="images.jfif" alt="Capivara de pelúcia usando toca de unicórnio">
                                <h3>nome</h3>
                                <p>RS 67.69</p>
                                <a href="https://www.youtube.com/watch?v=GBIIQ0kP15E" target="_blank">Detalhes</a>
                            </div>
                        </th>
                    </tr>
                </table>
            </section>
            <section>
                <h2>Cadastrar produto</h2>
                <!-- formulário -->
                <form method="post" action"/cadastro">
                    <label>Imagem:</label>
                    <input type="file" name="img">
                    <label>Nome:</label>
                    <input type="text" name="nome">
                    <label>Preço:</label>
                    <input type="number" name="preco">
                    <button>Enviar</button>
                </form>
            </section>
        </main>
        <footer>
            <p>Minha loja</p>
        </footer>
    </body>
</html>
